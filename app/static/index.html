<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>HR Compass AI</title>
<style>
  :root {
    --bg: #f6f7fb;
    --panel: #ffffff;
    --panel-alt: #f8fafc;
    --border: #e4e7ec;
    --text: #101828;
    --text-muted: #667085;
    --accent: #0f766e;
    --accent-hover: #0d9488;
    --accent-soft: #ccfbf1;
    --accent-dark: #115e59;
    --accent-contrast: #ffffff;
    --user-bubble: linear-gradient(135deg, #0f766e, #0d9488);
    --user-bubble-text: #ffffff;
    --assistant-bubble: #ffffff;
    --warn-bg: #fffbeb; --warn-border: #f59e0b; --warn-text: #92400e;
    --confirm-bg: #eff6ff; --confirm-border: #3b82f6; --confirm-text: #1e40af;
    --error-bg: #fef2f2; --error-border: #ef4444; --error-text: #b91c1c;
    --escalate-bg: #fdf2f8; --escalate-border: #ec4899; --escalate-text: #9d174d;
    --code-bg: #f1f5f9;
    --radius: 14px;
    --shadow-sm: 0 1px 2px rgba(16,24,40,.04), 0 1px 3px rgba(16,24,40,.08);
    --shadow-md: 0 4px 12px rgba(16,24,40,.08);
    color-scheme: light;
  }

  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) { color-scheme: dark; }
    :root:not([data-theme="light"]) {
      --bg: #0e1015;
      --panel: #161922;
      --panel-alt: #1c2029;
      --border: #2a2f3a;
      --text: #e8eaf0;
      --text-muted: #9aa2b1;
      --accent: #2dd4bf;
      --accent-hover: #5eead4;
      --accent-soft: rgba(45, 212, 191, .16);
      --accent-dark: #0f766e;
      --accent-contrast: #062824;
      --user-bubble: linear-gradient(135deg, #0f766e, #14b8a6);
      --user-bubble-text: #ffffff;
      --assistant-bubble: #1c2029;
      --warn-bg: rgba(245,158,11,.14); --warn-border: #f59e0b; --warn-text: #fbbf24;
      --confirm-bg: rgba(59,130,246,.14); --confirm-border: #3b82f6; --confirm-text: #93c5fd;
      --error-bg: rgba(239,68,68,.14); --error-border: #ef4444; --error-text: #fca5a5;
      --escalate-bg: rgba(236,72,153,.14); --escalate-border: #ec4899; --escalate-text: #f9a8d4;
      --code-bg: #10131a;
      --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
      --shadow-md: 0 8px 20px rgba(0,0,0,.45);
    }
  }
  :root[data-theme="dark"] {
    color-scheme: dark;
    --bg: #0e1015;
    --panel: #161922;
    --panel-alt: #1c2029;
    --border: #2a2f3a;
    --text: #e8eaf0;
    --text-muted: #9aa2b1;
    --accent: #2dd4bf;
    --accent-hover: #5eead4;
    --accent-soft: rgba(45, 212, 191, .16);
    --accent-dark: #0f766e;
    --accent-contrast: #062824;
    --user-bubble: linear-gradient(135deg, #0f766e, #14b8a6);
    --user-bubble-text: #ffffff;
    --assistant-bubble: #1c2029;
    --warn-bg: rgba(245,158,11,.14); --warn-border: #f59e0b; --warn-text: #fbbf24;
    --confirm-bg: rgba(59,130,246,.14); --confirm-border: #3b82f6; --confirm-text: #93c5fd;
    --error-bg: rgba(239,68,68,.14); --error-border: #ef4444; --error-text: #fca5a5;
    --escalate-bg: rgba(236,72,153,.14); --escalate-border: #ec4899; --escalate-text: #f9a8d4;
    --code-bg: #10131a;
    --shadow-sm: 0 1px 2px rgba(0,0,0,.4), 0 1px 3px rgba(0,0,0,.5);
    --shadow-md: 0 8px 20px rgba(0,0,0,.45);
  }

  * { box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: var(--bg);
    color: var(--text);
    height: 100vh;
    display: flex;
    flex-direction: column;
    -webkit-font-smoothing: antialiased;
  }

  header {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px clamp(12px, 3vw, 24px);
    background: var(--panel);
    border-bottom: 1px solid var(--border);
    flex-wrap: wrap;
  }
  .logo {
    width: 38px; height: 38px;
    flex: 0 0 auto;
    border-radius: 10px;
    background: linear-gradient(135deg, var(--accent), var(--accent-dark));
    display: flex; align-items: center; justify-content: center;
    box-shadow: var(--shadow-sm);
  }
  .logo svg { width: 22px; height: 22px; }
  .header-titles { min-width: 0; }
  header h1 {
    font-size: 17px;
    margin: 0;
    letter-spacing: -0.01em;
  }
  header p {
    margin: 1px 0 0;
    font-size: 12.5px;
    color: var(--text-muted);
    white-space: nowrap;
    overflow: hidden;
    text-overflow: ellipsis;
  }
  .header-actions {
    margin-left: auto;
    display: flex;
    align-items: center;
    gap: 8px;
  }
  .icon-button {
    width: 36px; height: 36px;
    display: flex; align-items: center; justify-content: center;
    border-radius: 9px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text-muted);
    cursor: pointer;
    transition: background .15s ease, color .15s ease, border-color .15s ease;
  }
  .icon-button:hover { color: var(--text); border-color: var(--accent); }
  .icon-button svg { width: 18px; height: 18px; }
  .theme-toggle .icon-moon { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-sun { display: none; }
  :root[data-theme="dark"] .theme-toggle .icon-moon { display: block; }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) .theme-toggle .icon-sun { display: none; }
    :root:not([data-theme="light"]) .theme-toggle .icon-moon { display: block; }
  }
  #sidebar-toggle { display: none; }

  main {
    flex: 1;
    display: flex;
    overflow: hidden;
    position: relative;
  }
  #chat-column {
    flex: 1;
    display: flex;
    flex-direction: column;
    min-width: 0;
  }
  #messages {
    flex: 1;
    overflow-y: auto;
    padding: 20px clamp(12px, 3vw, 24px);
    display: flex;
    flex-direction: column;
    gap: 16px;
    scroll-behavior: smooth;
  }
  .empty-state {
    margin: auto;
    text-align: center;
    color: var(--text-muted);
    max-width: 360px;
    padding: 24px;
  }
  .empty-state .logo { width: 52px; height: 52px; border-radius: 14px; margin: 0 auto 16px; }
  .empty-state .logo svg { width: 30px; height: 30px; }
  .empty-state h2 { color: var(--text); font-size: 16px; margin: 0 0 6px; }
  .empty-state p { font-size: 13.5px; line-height: 1.5; margin: 0; }

  .message {
    display: flex;
    flex-direction: column;
    max-width: min(720px, 92%);
    animation: rise .18s ease-out;
  }
  @keyframes rise {
    from { opacity: 0; transform: translateY(4px); }
    to { opacity: 1; transform: translateY(0); }
  }
  .message.user { align-self: flex-end; align-items: flex-end; }
  .message.assistant { align-self: flex-start; align-items: flex-start; }
  .bubble {
    padding: 12px 16px;
    border-radius: var(--radius);
    line-height: 1.55;
    font-size: 14.5px;
    box-shadow: var(--shadow-sm);
    word-wrap: break-word;
    overflow-wrap: anywhere;
  }
  .bubble p { margin: 0 0 8px; }
  .bubble p:last-child { margin-bottom: 0; }
  .bubble ul, .bubble ol { margin: 0 0 8px; padding-left: 20px; }
  .bubble ul:last-child, .bubble ol:last-child { margin-bottom: 0; }
  .bubble li { margin: 2px 0; }
  .bubble code {
    font-family: ui-monospace, "SF Mono", Menlo, monospace;
    font-size: 0.9em;
    background: var(--code-bg);
    border-radius: 4px;
    padding: 1px 5px;
  }
  .bubble strong { font-weight: 700; }
  .message.user .bubble { background: var(--user-bubble); color: var(--user-bubble-text); border-bottom-right-radius: 4px; }
  .message.user .bubble code { background: rgba(255,255,255,.18); }
  .message.assistant .bubble { background: var(--assistant-bubble); border: 1px solid var(--border); border-bottom-left-radius: 4px; }
  .message.assistant .bubble.loading { color: var(--text-muted); font-style: italic; }
  .message.assistant .bubble.error { background: var(--error-bg); border-color: var(--error-border); color: var(--error-text); }

  .typing-dots { display: inline-flex; gap: 3px; vertical-align: middle; margin-left: 4px; }
  .typing-dots span {
    width: 5px; height: 5px; border-radius: 50%;
    background: var(--text-muted);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing-dots span:nth-child(2) { animation-delay: .15s; }
  .typing-dots span:nth-child(3) { animation-delay: .3s; }
  @keyframes bounce { 0%, 80%, 100% { opacity: .3; transform: translateY(0); } 40% { opacity: 1; transform: translateY(-3px); } }

  .badge {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    font-size: 12px;
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    margin-top: 6px;
  }
  .badge.clarify { background: var(--warn-bg); border: 1px solid var(--warn-border); color: var(--warn-text); }
  .badge.confirm { background: var(--confirm-bg); border: 1px solid var(--confirm-border); color: var(--confirm-text); }
  .badge.escalated { background: var(--escalate-bg); border: 1px solid var(--escalate-border); color: var(--escalate-text); }

  .confirm-actions { display: flex; gap: 8px; margin-top: 8px; }
  .confirm-actions button {
    font-size: 13px; padding: 6px 14px; border-radius: 8px; cursor: pointer;
    border: 1px solid var(--confirm-border); background: var(--panel); color: var(--confirm-text); font-weight: 600;
    transition: background .15s ease;
  }
  .confirm-actions button.yes { background: var(--confirm-border); color: #ffffff; }
  .confirm-actions button:hover { filter: brightness(1.05); }

  .citations {
    margin-top: 8px;
    display: flex;
    flex-wrap: wrap;
    gap: 6px;
  }
  .citation-chip {
    font-size: 11.5px;
    background: var(--accent-soft);
    color: var(--accent-dark);
    border-radius: 6px;
    padding: 4px 8px;
    cursor: pointer;
    border: 1px solid transparent;
  }
  :root[data-theme="dark"] .citation-chip { color: var(--accent); }
  @media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .citation-chip { color: var(--accent); } }
  .citation-chip:hover { border-color: var(--accent); }
  .citation-detail {
    font-size: 12.5px;
    color: var(--text-muted);
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 8px;
    padding: 8px 10px;
    margin-top: 6px;
    display: none;
    max-width: min(640px, 100%);
  }
  .citation-detail.open { display: block; }

  details.trace-panel {
    margin-top: 8px;
    font-size: 12.5px;
    max-width: min(640px, 100%);
  }
  details.trace-panel summary {
    cursor: pointer;
    color: var(--text-muted);
    font-weight: 600;
    user-select: none;
  }
  .trace-step {
    display: flex;
    gap: 8px;
    padding: 6px 0;
    border-top: 1px solid var(--border);
    align-items: baseline;
  }
  .trace-step .n { color: var(--text-muted); min-width: 16px; }
  .trace-step .tool-name { font-weight: 600; font-family: ui-monospace, monospace; }
  .trace-step .status-ok { color: #16a34a; font-size: 11px; }
  .trace-step .status-error { color: #dc2626; font-size: 11px; }
  .trace-step .summary { color: var(--text-muted); }
  .trace-step .args { font-family: ui-monospace, monospace; font-size: 11px; color: var(--text-muted); opacity: .8; }

  #input-row {
    display: flex;
    gap: 10px;
    padding: 14px clamp(12px, 3vw, 24px);
    background: var(--panel);
    border-top: 1px solid var(--border);
  }
  #message-input {
    flex: 1;
    padding: 11px 14px;
    border-radius: 10px;
    border: 1px solid var(--border);
    background: var(--panel-alt);
    color: var(--text);
    font-size: 14.5px;
    resize: none;
    font-family: inherit;
    max-height: 140px;
  }
  #message-input::placeholder { color: var(--text-muted); }
  #message-input:focus { outline: none; border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-soft); }
  #send-button {
    padding: 0 22px;
    border-radius: 10px;
    border: none;
    background: var(--accent);
    color: var(--accent-contrast);
    font-weight: 600;
    cursor: pointer;
    font-size: 14px;
    transition: background .15s ease;
  }
  #send-button:hover:not(:disabled) { background: var(--accent-hover); }
  #send-button:disabled { background: var(--text-muted); opacity: .5; cursor: not-allowed; }

  #sidebar {
    width: 264px;
    flex: 0 0 auto;
    background: var(--panel);
    border-left: 1px solid var(--border);
    padding: 18px;
    overflow-y: auto;
    font-size: 13px;
  }
  #sidebar h2 { font-size: 12.5px; margin: 0 0 10px; color: var(--text-muted); text-transform: uppercase; letter-spacing: 0.06em; }
  #sidebar .example-prompt {
    display: block;
    text-align: left;
    width: 100%;
    background: var(--panel-alt);
    border: 1px solid var(--border);
    border-radius: 10px;
    padding: 9px 11px;
    margin-bottom: 8px;
    cursor: pointer;
    font-size: 12.5px;
    color: var(--text);
    transition: border-color .15s ease, background .15s ease;
  }
  #sidebar .example-prompt:hover { border-color: var(--accent); background: var(--accent-soft); }

  #sidebar-backdrop {
    display: none;
    position: fixed;
    inset: 0;
    background: rgba(0,0,0,.4);
    z-index: 20;
  }

  @media (max-width: 900px) {
    #sidebar {
      position: fixed;
      top: 0; right: 0; bottom: 0;
      z-index: 30;
      width: min(300px, 84vw);
      box-shadow: var(--shadow-md);
      transform: translateX(100%);
      transition: transform .2s ease;
    }
    #sidebar.open { transform: translateX(0); }
    #sidebar-backdrop.open { display: block; }
    #sidebar-toggle { display: flex; }
  }

  @media (max-width: 560px) {
    header p { display: none; }
    header h1 { font-size: 15.5px; }
    .logo { width: 32px; height: 32px; }
    .logo svg { width: 18px; height: 18px; }
    .bubble { font-size: 14px; padding: 10px 13px; }
    #input-row { gap: 8px; }
    #send-button { padding: 0 16px; }
  }
</style>
</head>
<body>

<header>
  <div class="logo" aria-hidden="true">
    <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
      <circle cx="12" cy="12" r="9.25" stroke="white" stroke-width="1.6"/>
      <path d="M15.3 8.7 L13 13 L8.7 15.3 L11 11 Z" fill="white"/>
      <circle cx="12" cy="12" r="1.15" fill="white"/>
    </svg>
  </div>
  <div class="header-titles">
    <h1>HR Compass AI</h1>
    <p>Solara Dynamics HR Assistant (synthetic demo data)</p>
  </div>
  <div class="header-actions">
    <button class="icon-button theme-toggle" id="theme-toggle" type="button" aria-label="Toggle dark mode">
      <svg class="icon-sun" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="4.2"/><path d="M12 2.5v2.4M12 19.1v2.4M4.6 4.6l1.7 1.7M17.7 17.7l1.7 1.7M2.5 12h2.4M19.1 12h2.4M4.6 19.4l1.7-1.7M17.7 6.3l1.7-1.7"/></svg>
      <svg class="icon-moon" viewBox="0 0 24 24" fill="currentColor"><path d="M20.5 14.8A8.5 8.5 0 1 1 9.2 3.5a7 7 0 0 0 11.3 11.3Z"/></svg>
    </button>
    <button class="icon-button" id="sidebar-toggle" type="button" aria-label="Show example prompts">
      <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><path d="M4 7h16M4 12h16M4 17h10"/></svg>
    </button>
  </div>
</header>

<main>
  <div id="chat-column">
    <div id="messages">
      <div class="empty-state" id="empty-state">
        <div class="logo" aria-hidden="true">
          <svg viewBox="0 0 24 24" fill="none" xmlns="http://www.w3.org/2000/svg">
            <circle cx="12" cy="12" r="9.25" stroke="white" stroke-width="1.6"/>
            <path d="M15.3 8.7 L13 13 L8.7 15.3 L11 11 Z" fill="white"/>
            <circle cx="12" cy="12" r="1.15" fill="white"/>
          </svg>
        </div>
        <h2>Ask HR Compass AI</h2>
        <p>Ask about PTO, benefits, remote work, or any HR policy. Try a prompt from the panel to get started.</p>
      </div>
    </div>
    <div id="input-row">
      <textarea id="message-input" rows="1" placeholder="Ask about PTO, benefits, or policies…"></textarea>
      <button id="send-button">Send</button>
    </div>
  </div>
  <div id="sidebar-backdrop"></div>
  <aside id="sidebar">
    <h2>Try asking</h2>
    <button class="example-prompt" data-prompt="What is Solara's paid holiday policy?">What is Solara's paid holiday policy?</button>
    <button class="example-prompt" data-prompt="My employee ID is EMP-1001. Can I take three days of PTO next week?">My employee ID is EMP-1001. Can I take three days of PTO next week?</button>
    <button class="example-prompt" data-prompt="I'm EMP-1002. Can I work from Colorado for six weeks?">I'm EMP-1002. Can I work from Colorado for six weeks?</button>
    <button class="example-prompt" data-prompt="I'm EMP-1003. Can I work from Portugal for six weeks?">I'm EMP-1003. Can I work from Portugal for six weeks?</button>
    <button class="example-prompt" data-prompt="EMP-1004 &mdash; am I enrolled in medical benefits?">EMP-1004 &mdash; am I enrolled in medical benefits?</button>
    <button class="example-prompt" data-prompt="Can I work somewhere else next month?">Can I work somewhere else next month?</button>
    <button class="example-prompt" data-prompt="How much PTO do I have?">How much PTO do I have?</button>
    <button class="example-prompt" data-prompt="What is the company's stock option vesting schedule?">What is the company's stock option vesting schedule?</button>
    <button class="example-prompt" data-prompt="I want to report harassment by a coworker.">I want to report harassment by a coworker.</button>
  </aside>
</main>

<script>
const messagesEl = document.getElementById('messages');
const inputEl = document.getElementById('message-input');
const sendButton = document.getElementById('send-button');
const emptyStateEl = document.getElementById('empty-state');
const sidebarEl = document.getElementById('sidebar');
const sidebarBackdropEl = document.getElementById('sidebar-backdrop');

let conversationId = null;

function escapeHtml(s) {
  const div = document.createElement('div');
  div.textContent = s;
  return div.innerHTML;
}

// --- Theme -------------------------------------------------------------

function applyTheme(theme) {
  if (theme === 'light' || theme === 'dark') {
    document.documentElement.setAttribute('data-theme', theme);
  } else {
    document.documentElement.removeAttribute('data-theme');
  }
}

function initTheme() {
  let saved = null;
  try { saved = localStorage.getItem('hr-compass-theme'); } catch (e) { /* ignore */ }
  applyTheme(saved);
}

document.getElementById('theme-toggle').addEventListener('click', () => {
  const prefersDark = window.matchMedia('(prefers-color-scheme: dark)').matches;
  const current = document.documentElement.getAttribute('data-theme') || (prefersDark ? 'dark' : 'light');
  const next = current === 'dark' ? 'light' : 'dark';
  applyTheme(next);
  try { localStorage.setItem('hr-compass-theme', next); } catch (e) { /* ignore */ }
});

initTheme();

// --- Mobile sidebar drawer ----------------------------------------------

function openSidebar() {
  sidebarEl.classList.add('open');
  sidebarBackdropEl.classList.add('open');
}
function closeSidebar() {
  sidebarEl.classList.remove('open');
  sidebarBackdropEl.classList.remove('open');
}
document.getElementById('sidebar-toggle').addEventListener('click', openSidebar);
sidebarBackdropEl.addEventListener('click', closeSidebar);

// --- Minimal, safe markdown-lite rendering -------------------------------
// Escapes all input first, then only ever introduces a small, fixed set of
// HTML tags (<strong>, <em>, <code>, <p>, <ul>, <li>, <br>) via string
// replacement on the already-escaped text, so no attacker-controlled markup
// can reach innerHTML.

function renderInline(escapedText) {
  const codeSpans = [];
  let out = escapedText.replace(/`([^`]+?)`/g, (_, code) => {
    codeSpans.push(code);
    return `\u0000${codeSpans.length - 1}\u0000`;
  });
  out = out.replace(/\*\*([^\n]+?)\*\*/g, '<strong>$1</strong>');
  out = out.replace(/(^|[\s(])\*([^\s*][^\n]*?)\*(?=$|[\s).,!?])/g, '$1<em>$2</em>');
  out = out.replace(/\u0000(\d+)\u0000/g, (_, i) => `<code>${codeSpans[Number(i)]}</code>`);
  return out;
}

function renderBlock(block) {
  const lines = block.split('\n').filter(l => l.length > 0);
  const isListLine = (l) => /^\s*[-*]\s+/.test(l);
  let html = '';
  let i = 0;
  while (i < lines.length) {
    if (isListLine(lines[i])) {
      const items = [];
      while (i < lines.length && isListLine(lines[i])) {
        items.push(`<li>${renderInline(lines[i].replace(/^\s*[-*]\s+/, ''))}</li>`);
        i++;
      }
      html += `<ul>${items.join('')}</ul>`;
    } else {
      const textLines = [];
      while (i < lines.length && !isListLine(lines[i])) {
        textLines.push(renderInline(lines[i]));
        i++;
      }
      html += `<p>${textLines.join('<br>')}</p>`;
    }
  }
  return html;
}

function renderMarkdownLite(text) {
  const escaped = escapeHtml(text || '');
  return escaped.split(/\n{2,}/).map(renderBlock).join('');
}

// --- Message rendering ---------------------------------------------------

function hideEmptyState() {
  if (emptyStateEl) emptyStateEl.remove();
}

function addUserMessage(text) {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'message user';
  div.innerHTML = `<div class="bubble">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addLoadingMessage() {
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.id = 'loading-message';
  div.innerHTML = `<div class="bubble loading">Thinking<span class="typing-dots"><span></span><span></span><span></span></span></div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function removeLoadingMessage() {
  const el = document.getElementById('loading-message');
  if (el) el.remove();
}

function renderTrace(trace) {
  if (!trace || trace.length === 0) return '';
  const steps = trace.map(step => {
    const statusClass = step.status === 'success' ? 'status-ok' : 'status-error';
    const args = step.arguments ? JSON.stringify(step.arguments) : '';
    const tool = step.tool || '(decision)';
    return `<div class="trace-step">
      <span class="n">${step.step}.</span>
      <div>
        <div><span class="tool-name">${escapeHtml(tool)}</span> <span class="${statusClass}">${escapeHtml(step.status)}</span></div>
        ${args ? `<div class="args">${escapeHtml(args)}</div>` : ''}
        <div class="summary">${escapeHtml(step.result_summary || '')}</div>
        ${step.escalation ? `<div class="args">escalation: ${escapeHtml(step.escalation)}</div>` : ''}
        ${step.duration_ms != null ? `<div class="args">${Math.round(step.duration_ms)} ms</div>` : ''}
      </div>
    </div>`;
  }).join('');
  return `<details class="trace-panel">
    <summary>Agent Activity (${trace.length} step${trace.length === 1 ? '' : 's'})</summary>
    ${steps}
  </details>`;
}

function renderCitations(citations) {
  if (!citations || citations.length === 0) return '';
  const chips = citations.map((c) => {
    return `<span class="citation-chip" onclick="toggleCitation(this)">${escapeHtml(c.document_id)} &sect;${escapeHtml(c.section)}</span>
      <div class="citation-detail">${escapeHtml(c.document_title)} &mdash; ${escapeHtml(c.section)}<br><em>&ldquo;${escapeHtml(c.snippet)}&rdquo;</em></div>`;
  }).join('');
  return `<div class="citations">${chips}</div>`;
}

window.toggleCitation = function(chip) {
  const detail = chip.nextElementSibling;
  detail.classList.toggle('open');
};

function addAssistantMessage(result) {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'message assistant';

  let badges = '';
  if (result.requires_clarification) {
    badges += `<span class="badge clarify">Clarification needed</span>`;
  }
  if (result.requires_confirmation) {
    badges += `<span class="badge confirm">Confirmation needed</span>`;
  }
  if (result.escalated) {
    badges += `<span class="badge escalated">Escalated</span>`;
  }

  let confirmActions = '';
  if (result.requires_confirmation) {
    confirmActions = `<div class="confirm-actions">
      <button class="yes" onclick="sendQuickReply('Yes, please proceed.')">Yes, proceed</button>
      <button onclick="sendQuickReply('No, thanks.')">No</button>
    </div>`;
  }

  div.innerHTML = `
    <div class="bubble">${renderMarkdownLite(result.answer)}</div>
    ${badges}
    ${confirmActions}
    ${renderCitations(result.citations)}
    ${renderTrace(result.trace)}
  `;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

function addErrorMessage(text) {
  hideEmptyState();
  const div = document.createElement('div');
  div.className = 'message assistant';
  div.innerHTML = `<div class="bubble error">${escapeHtml(text)}</div>`;
  messagesEl.appendChild(div);
  messagesEl.scrollTop = messagesEl.scrollHeight;
}

async function sendMessage(text) {
  if (!text.trim()) return;
  closeSidebar();
  addUserMessage(text);
  inputEl.value = '';
  autoGrow();
  sendButton.disabled = true;
  addLoadingMessage();

  try {
    const res = await fetch('/chat', {
      method: 'POST',
      headers: { 'Content-Type': 'application/json' },
      body: JSON.stringify({ message: text, conversation_id: conversationId }),
    });
    removeLoadingMessage();
    if (!res.ok) {
      const errBody = await res.json().catch(() => ({}));
      addErrorMessage(errBody.detail || `Request failed (${res.status}).`);
      return;
    }
    const data = await res.json();
    conversationId = data.conversation_id;
    addAssistantMessage(data);
  } catch (e) {
    removeLoadingMessage();
    addErrorMessage('Could not reach HR Compass AI. Please check your connection and try again.');
  } finally {
    sendButton.disabled = false;
  }
}

window.sendQuickReply = function(text) {
  sendMessage(text);
};

function autoGrow() {
  inputEl.style.height = 'auto';
  inputEl.style.height = Math.min(inputEl.scrollHeight, 140) + 'px';
}

sendButton.addEventListener('click', () => sendMessage(inputEl.value));
inputEl.addEventListener('input', autoGrow);
inputEl.addEventListener('keydown', (e) => {
  if (e.key === 'Enter' && !e.shiftKey) {
    e.preventDefault();
    sendMessage(inputEl.value);
  }
});
document.querySelectorAll('.example-prompt').forEach(btn => {
  btn.addEventListener('click', () => sendMessage(btn.dataset.prompt));
});
</script>

</body>
</html>
